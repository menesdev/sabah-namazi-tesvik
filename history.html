<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geçmiş | Günlük Planlayıcı</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .history-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }
  .day-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .day-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .day-date {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--green-deep);
    border-bottom: 2px solid var(--gold-light);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .day-stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .stat-badge {
    background: var(--green-pale);
    color: var(--green-deep);
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: bold;
  }
  .day-rating {
    color: var(--gold);
    font-size: 18px;
    margin-bottom: 10px;
  }
  .day-notes {
    font-family: 'Amiri', serif;
    font-size: 14px;
    color: var(--text-muted);
    font-style: italic;
    background: var(--cream);
    padding: 10px;
    border-radius: 6px;
    margin-top: 10px;
  }
  .loading-msg {
    text-align: center;
    padding: 40px;
    font-size: 16px;
    color: var(--text-light);
  }
</style>
</head>
<body>
<div class="page-bg">

  <div class="header" style="padding-bottom: 20px;">
    <div class="header-inner">
      <div class="header-top">
        <div>
          <span class="basmala">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</span>
          <p class="header-title" style="color:var(--gold-light)">Geçmiş Analizi</p>
          <p class="header-date" style="font-size:24px;">Geriye Dönük İzleme</p>
        </div>
        <div class="date-controls">
          <a href="index.html" style="background:rgba(255,255,255,0.2); text-decoration:none; border:1px solid rgba(255,255,255,0.3); padding:8px 16px; color:#fff; border-radius:8px; font-weight:bold; font-size:13px;">← Geri Dön</a>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div id="loading" class="loading-msg">Verileriniz buluttan yükleniyor...</div>
    <div class="history-grid" id="historyContainer"></div>
  </div>

</div>

<script type="module">
  import { auth, db, getDocs, collection, query, orderBy, onAuthStateChanged } from './firebase-config.js';

  onAuthStateChanged(auth, async (user) => {
    const container = document.getElementById('historyContainer');
    const loading = document.getElementById('loading');
    
    if (user) {
      try {
        const q = query(collection(db, 'users', user.uid, 'days'), orderBy('date', 'desc'));
        const snapshot = await getDocs(q);
        
        loading.style.display = 'none';

        if (snapshot.empty) {
          container.innerHTML = '<p style="text-align:center;width:100%;color:var(--text-light);">Henüz kaydedilmiş bir gününüz bulunmuyor. Ana sayfadan günü kaydedin.</p>';
          return;
        }

        let html = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          
          let starsHtml = '';
          const rating = data.evaluation?.stars || 0;
          for(let i=0; i<5; i++) {
            starsHtml += i < rating ? '★' : '☆';
          }
          
          const notesText = data.evaluation?.notes || 'Günün notu girilmemiş.';
          const sukranText = data.evaluation?.sukran || '';

          html += `
            <div class="day-card">
              <div class="day-date">${data.date}</div>
              <div class="day-rating">${starsHtml}</div>
              
              <div class="day-stats">
                <div>Namaz: <span class="stat-badge">${data.namazCount || '0/5'}</span></div>
                <div>Vird: <span class="stat-badge">${data.virdCount || '0/8'}</span></div>
              </div>
              <div class="day-stats">
                <div>Okuma: <span class="stat-badge">${data.okumaCount || '0%'}</span></div>
                <div>Hedefler: <span class="stat-badge">${data.hedefCount || '0/3'}</span></div>
              </div>
              
              <div class="day-notes">
                ${sukranText ? `<strong>Şükür:</strong> ${sukranText}<br>` : ''}
                <strong>Not:</strong> ${notesText}
              </div>
            </div>
          `;
        });
        
        container.innerHTML = html;
        
      } catch(e) {
        console.error("Geçmiş yükleme hatası:", e);
        loading.innerHTML = 'Veriler yüklenirken bir hata oluştu.';
      }
    } else {
      loading.style.display = 'none';
      container.innerHTML = `
        <div style="text-align:center; width:100%;">
          <p style="margin-bottom:12px;">Geçmişinizi görebilmek için hesaba giriş yapmalısınız.</p>
          <a href="index.html" style="background:var(--green-deep);color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;">Ana Sayfaya Dön ve Giriş Yap</a>
        </div>
      `;
    }
  });
</script>
</body>
</html>
